# ABLACAO — FASE 2 SEM o filtro de SSIM, 2 GPUs, dgx-H100-01 (DOCKER).
#
# PERGUNTA: o filtro que adicionamos (paper 3.2c, "provided that its
# corresponding SSIM exceeds a predefined threshold") ajudou de fato? Ele
# descarta 2,8% da rota c. Esta ablacao treina SEM ele e permite comparar contra
# o treino original, que o usa com limiar 0,6.
#
# E a defesa (ou a refutacao) de uma decisao de metodo NOSSA — o paper manda
# filtrar mas nao publica o limiar, entao o 0,6 foi escolha nossa.
#
# NAO SOBRESCREVE NADA: outputs/bokehnet_fase2_nofilter + repo HF proprio.
#
# Currículo do paper §4.1 (literal): "BokehNet is trained in two stages: (i) 40K
# steps on synthetic data, and (ii) 60K steps on real data." Esta é a FASE 2.
# Inicia do LoRA da fase 1 via --init-lora, com optimizer/scheduler FRESCOS
# (novo warmup + cosine sobre os 60K), porque o §3.2(a) chama a fase sintética
# de "pretrain" — pré-treino seguido de treino, não continuação.
#
# DIFERENCAS vs train_bokeh_real_4gpu.yaml (o antigo). Todas registradas em
# DECISOES_FASE2.md:
#   1. min_calibration_ssim: aplica o filtro do paper §3.2(c), que o config
#      antigo não tinha. Ver abaixo.
#   2. upload_hf_repo_base e run_name NOVOS, para não sobrescrever nada do que
#      já está no HF (a fase 1 vive em genrefocus-bokehnet-synth-condlora e
#      genrefocus-bokehnet-synth-2gpu).
#   3. output_dir próprio.
#
# rank 64; batch efetivo 32 = 1 × 8 (accum) × 4 (GPUs), igual ao paper §4.1.
# 2 condições: AIF em [-1,1] + defocus map em [0,1].

model:
  pretrained_model_name_or_path: black-forest-labs/FLUX.1-dev
  vae_subfolder: vae
  transformer_subfolder: transformer
  max_coc: 100.0
  deblur_lora_rank: 128
  bokeh_lora_rank: 64
  gradient_checkpointing: false

runtime:
  output_dir: outputs/bokehnet_fase2_nofilter
  seed: 42
  num_workers: 4
  pin_memory: true
  mixed_precision: bf16
  gradient_accumulation_steps: 16    # 1 × 16 × 2 GPUs = batch efetivo 32
  max_grad_norm: 1.0
  log_every_steps: 10
  save_every_steps: 250
  keep_last_n_checkpoints: 5
  resume: true

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_steps: 500
  min_lr_ratio: 0.1

data:
  bokeh:
    datasets:
      # Rota b = análoga ao ITW do paper (§3.2(b)): foto de bokeh REAL como
      # entrada, AIF extraído pela DeblurNet, K pela Eq. 3 a partir da EXIF.
      # RESSALVA MEDIDA (2026-08-13): auditamos 300 amostras e o k é 50.0 em
      # TODAS — o valor de FALLBACK do pipeline de dados. A EXIF tem f_number e
      # focal_length, mas a Eq. 3 exige D_focus em METROS e a coluna `depth` foi
      # gravada normalizada em [0,1], perdendo a escala. Consequência: a rota b
      # entra sem NENHUMA variação de bokeh level. Ela ainda ensina aparência
      # óptica real (o que faltava depois da fase 1), mas não ensina controle de
      # intensidade. Pendente com o time de dados. Ver DECISOES_FASE2.md.
      - name: AKCITPixel3/BKXcuVXCmeRvN   # rota b (real + EXIF, ~ITW)
        split: train
      # Rota c = LFDOF/RealBokeh do paper (§3.2(c)): pares reais, K calibrado
      # por sweep de SSIM (Eq. 5). É de onde vem TODA a variação de K que temos
      # (k de 0 a 300).
      - name: AKCITPixel3/CMiQdveBBzNii   # rota c (pares reais, K por SSIM)
        split: train
    steps: 60000                          # FASE 2: 60K real (paper §4.1)
    # Mapa de defocus RECOMPOSTO de depth+k+s1 com clip(k*|D-s1|/max_coc, 0, 1),
    # a fórmula da inferência oficial. NÃO usamos a coluna `defocus_map`, que foi
    # salva normalizada POR IMAGEM e portanto apaga o k.
    defocus_source: recompute
    # FILTRO DO PAPER §3.2(c), citação literal: "The selected K* is then used as
    # the pseudo-bokeh-level label for training, provided that its corresponding
    # SSIM exceeds a predefined threshold to ensure reliable supervision."
    # Aplica-se só a fontes com a coluna `calibration_ssim` (rota c); a rota b
    # passa inteira, como no paper, onde o limiar aparece apenas no item (c).
    # O paper NÃO publica o valor ("predefined"), então este é escolha nossa,
    # calibrada na distribuição real da coluna. Ver DECISOES_FASE2.md.
    min_calibration_ssim: null         # ABLACAO: sem o filtro do paper
    batch_size: 1
    image_size: 512
    shuffle: true

logging:
  use_wandb: true
  wandb_project: genrefocus-bokehnet
  wandb_entity: null
  run_name: bokehnet-fase2-nofilter
  upload_every_steps: 1000
  # Repo NOVO: não sobrescreve a fase 1 (genrefocus-bokehnet-synth-condlora).
  upload_hf_repo_base: genrefocus-bokehnet-fase2-nofilter
