# TESTE RÁPIDO de 2 GPUs — valida o caminho multi-GPU (DDP-free + all-reduce)
# SEM esperar o filtro do RealBokeh. Só DDPD, poucos steps, sem upload.
# Se rodar ~40 steps logando loss nas 2 GPUs (sem AttributeError), o conserto
# está ok e pode lançar o train_base_2gpu de verdade.

model:
  pretrained_model_name_or_path: black-forest-labs/FLUX.1-dev
  vae_subfolder: vae
  transformer_subfolder: transformer
  max_coc: 100.0
  deblur_lora_rank: 128
  bokeh_lora_rank: 64
  gradient_checkpointing: false      # GC OFF (igual ao plano de 4 GPUs): testa se cabe + mais rápido

runtime:
  output_dir: outputs/deblurnet_2gpu_test_condlora
  seed: 42
  num_workers: 4
  pin_memory: true
  mixed_precision: bf16
  gradient_accumulation_steps: 16   # 16 × 2 GPUs = batch efetivo 32
  max_grad_norm: 1.0
  log_every_steps: 1
  save_every_steps: 1000            # não salva nesse teste curto
  keep_last_n_checkpoints: 2
  resume: false

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_steps: 10
  min_lr_ratio: 0.1

data:
  deblur:
    datasets:
      - name: akcit-pixel/DDPD
        split: train
    steps: 40
    batch_size: 1
    image_size: 512
    shuffle: true

logging:
  use_wandb: true
  wandb_project: genrefocus-deblurnet
  wandb_entity: null
  run_name: deblurnet-2gpu-test-condlora
