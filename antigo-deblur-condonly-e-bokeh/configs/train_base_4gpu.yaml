# DeblurNet (Stage 1) — TREINO DO PAPER em 4 GPUs, com GC DESLIGADO (mais rápido).
#
# FIEL AO PAPER: DPDD completo + top-3000 RealBokeh (Laplaciano), rank 128, 512²,
# bf16, 60K steps, batch EFETIVO 32.
#
# Batch efetivo = batch_size(1) × gradient_accumulation_steps(8) × num_gpus(4) = 32 ✅
#
# gradient_checkpointing: false  → guarda as ativações em vez de recalcular no
#   backward. ~30% MAIS RÁPIDO, porém usa mais VRAM. Se der "CUDA out of memory"
#   no começo, troque pra true (aí volta a caber, só fica mais lento).

model:
  pretrained_model_name_or_path: black-forest-labs/FLUX.1-dev
  vae_subfolder: vae
  transformer_subfolder: transformer
  max_coc: 100.0
  deblur_lora_rank: 128
  bokeh_lora_rank: 64
  gradient_checkpointing: false      # GC OFF = mais rápido (testar se cabe na VRAM)

runtime:
  output_dir: outputs/deblurnet_paper_4gpu_condlora
  seed: 42
  num_workers: 4
  pin_memory: true
  mixed_precision: bf16
  gradient_accumulation_steps: 8     # 1 × 8 × 4 GPUs = batch efetivo 32 (paper)
  max_grad_norm: 1.0
  log_every_steps: 10
  save_every_steps: 250
  keep_last_n_checkpoints: 5
  resume: true

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_steps: 500
  min_lr_ratio: 0.1

data:
  deblur:
    datasets:
      - name: akcit-pixel/DDPD
        split: train
      - name: akcit-pixel/RealBokeh
        split: train
        top_k_sharpest: 3000
        sharpness_column: image_focus
    steps: 60000
    batch_size: 1
    image_size: 512
    shuffle: true

logging:
  use_wandb: true
  wandb_project: genrefocus-deblurnet
  wandb_entity: null
  run_name: deblurnet-paper-4gpu-condlora
  # Snapshot do LoRA pro HF a cada N steps, um repo POR-STEP:
  #   <base>-step5000, -step10000, ...  (pra comparar melhora com + steps)
  upload_every_steps: 5000
  upload_hf_repo_base: genrefocus-deblurnet-condlora
