# BokehNet (Stage 2) — FASE 2: DADOS REAIS, 4 GPUs.
#
# Currículo do paper §4.1, FASE 2: "BokehNet is trained in two stages: (i) 40K
# steps on synthetic data, and (ii) 60K steps on real data." Inicia o LoRA da
# FASE 1 (sintético) via --init-lora (ver o slurm), com optimizer/scheduler
# FRESCOS (novo warmup + cosine sobre os 60K reais). output_dir SEPARADO da
# fase 1.
#   real = rota b (real unpaired + EXIF, análoga ao ITW do paper) + rota c
#   (RealBokeh_3MP/LFDOF, pares reais sem EXIF, k calibrado por SSIM sweep).
#   Confirmado no README do bokehnet-data-pipeline (github.com/AKCIT-PIXEL/
#   bokehnet-data-pipeline): rota b usa uma foto de bokeh REAL como entrada
#   (nunca chama renderer/BokehMe) — DeblurNet extrai o AIF_proxy dela e o K
#   vem da EXIF real (Eq. 1 do paper), não de um K sorteado. Rota b NÃO é
#   sintética; estava incorretamente agrupada na fase 1 antes deste fix.
#
# rank 64; batch efetivo 32 = 1 × 8 × 4. 2 condições: AIF + defocus_map [0,1].

model:
  pretrained_model_name_or_path: black-forest-labs/FLUX.1-dev
  vae_subfolder: vae
  transformer_subfolder: transformer
  max_coc: 100.0
  deblur_lora_rank: 128
  bokeh_lora_rank: 64
  gradient_checkpointing: false

runtime:
  output_dir: outputs/bokehnet_real_4gpu
  seed: 42
  num_workers: 4
  pin_memory: true
  mixed_precision: bf16
  gradient_accumulation_steps: 8     # 1 × 8 × 4 GPUs = batch efetivo 32
  max_grad_norm: 1.0
  log_every_steps: 10
  save_every_steps: 250
  keep_last_n_checkpoints: 5
  resume: true

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_steps: 500
  min_lr_ratio: 0.1

data:
  bokeh:
    datasets:
      - name: AKCITPixel3/BKXcuVXCmeRvN   # rota b (real unpaired + EXIF, ~ITW)
        split: train
      - name: AKCITPixel3/CMiQdveBBzNii   # rota c (RealBokeh_3MP/LFDOF, pares reais)
        split: train
    steps: 60000                          # FASE 2: 60K real (paper §4.1)
    # Mapa de defocus: RECOMPOSTO de depth+k+s1 com clip(k*|D-s1|/max_coc,0,1),
    # a formula da inferencia oficial. NAO usamos a coluna `defocus_map` do df:
    # ela foi salva normalizada POR IMAGEM (dm/dm.max()), o que apaga o k e
    # treinaria um modelo sem controle de bokeh. Ver DEFOCUS_SOURCES em data.py.
    # Use "column" apenas para comparar com o comportamento antigo.
    defocus_source: recompute
    batch_size: 1
    image_size: 512
    shuffle: true

logging:
  use_wandb: true
  wandb_project: genrefocus-bokehnet
  wandb_entity: null
  run_name: bokehnet-real-4gpu
  upload_every_steps: 2500
  upload_hf_repo_base: genrefocus-bokehnet-condlora
