# Smoke test de DEBUG — idêntico ao train_smoke.yaml, MAS com
# gradient_checkpointing DESLIGADO.
#
# Motivo: o smoke normal estourou com "CUDA error: illegal memory access"
# num ponto enganoso (dentro do RECOMPUTE do gradient checkpointing). Desligar
# o GC remove o recompute, então — combinado com CUDA_LAUNCH_BLOCKING=1 no
# slurm — o stacktrace aponta a LINHA REAL do kernel que falha.
#
# Se o smoke PASSAR aqui (sem GC) mas falhar com GC, o bug é a interação do
# gradient checkpointing com o transformer_forward customizado do Genfocus.

model:
  pretrained_model_name_or_path: black-forest-labs/FLUX.1-dev
  max_coc: 100.0
  deblur_lora_rank: 16
  bokeh_lora_rank: 16
  gradient_checkpointing: false   # <<< DESLIGADO p/ debug (256² cabe fácil na H100)

runtime:
  output_dir: outputs/smoke_debug
  seed: 42
  num_workers: 0
  pin_memory: false
  mixed_precision: bf16
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  log_every_steps: 1
  save_every_steps: 1
  keep_last_n_checkpoints: 1
  resume: false

optimizer:
  name: adamw
  lr: 5.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_steps: 0
  min_lr_ratio: 0.1

data:
  deblur:
    datasets:
      - name: akcit-pixel/DDPD
        split: validation
    steps: 3
    batch_size: 1
    image_size: 256
    shuffle: false

logging:
  use_wandb: false
  wandb_project: genrefocus-train
  wandb_entity: null
  run_name: null
