# Smoke test da DeblurNet — valida o pipeline real (FLUX + LoRA + transformer_forward)
# em 3 steps, 1 batch, antes de gastar horas no treino de 60K steps.
#
# Usa o split `validation` do DDPD (menor: 73 exemplos) e resolução 256² para
# ser rápido. wandb e resume desligados. rank reduzido para carregar mais rápido.

model:
  pretrained_model_name_or_path: black-forest-labs/FLUX.1-dev
  max_coc: 100.0
  deblur_lora_rank: 16
  bokeh_lora_rank: 16
  gradient_checkpointing: true

runtime:
  output_dir: outputs/smoke
  seed: 42
  num_workers: 0
  pin_memory: false
  mixed_precision: bf16
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  log_every_steps: 1
  save_every_steps: 1
  keep_last_n_checkpoints: 1
  resume: false

optimizer:
  name: adamw
  lr: 5.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_steps: 0
  min_lr_ratio: 0.1

data:
  deblur:
    datasets:
      - name: akcit-pixel/DDPD
        split: validation
    steps: 3
    batch_size: 1
    image_size: 256
    shuffle: false

logging:
  use_wandb: false
  wandb_project: genrefocus-train
  wandb_entity: null
  run_name: null
