# =============================================================================
# BOKEHNET — SMOKE DO CONDICIONAMENTO GEOMETRICO. 3 steps, na h100n3.
# =============================================================================
#
# RODA COM:  sbatch slurm/condgeom_smoke_n3.slurm
#
# O que este smoke tem que PROVAR, e que o smoke normal nao prova:
#
#   1. VRAM com os DOIS branches geometricos ligados. A sequencia vai de 3.584
#      para 5.632 tokens, ~2,5x de atencao. A fase 1 esta usando 66,3 GB de 80
#      SEM branch extra. Descobrir OOM no step 3.000 em vez de aqui e o erro a
#      evitar, e ja aconteceu neste projeto.
#   2. Que o leitor de release em ARVORE emite `geo_map` (6, 512, 512) em [0,1].
#   3. Que a perda ponderada roda nos DOIS call sites (treino e validacao) sem
#      divergir — sao duplicados, e esquecer o segundo quebra o smoke.
#   4. Que `frac_borda` aparece no log. E o numero que calibra lambda.
#
# DEPENDENCIA: `geo_constantes` abaixo. Elas sao MEDIDAS no conjunto de treino,
# nao tem default no codigo, e o treino FALHA ALTO sem elas. Gere primeiro:
#     sbatch slurm/condgeom_calibrar_constantes_n3.slurm
#
# =============================================================================

model:
  pretrained_model_name_or_path: black-forest-labs/FLUX.1-dev
  max_coc: 100.0              # ASSERCAO do contrato, nao ajuste. Ver control.py.
  deblur_lora_rank: 128
  bokeh_lora_rank: 64         # §4.1
  expected_lora_modules: 343  # C1 — trava; bokehNet.safetensors tem 686/2 = 343
  bokeh_train_guidance: 1.0   # Inference_bokehNet.py passa guidance_scale=1.0
  cond_train_guidance: 1.0    # flux.py: c_guidances = torch.ones
  lora_on_main: false         # a inferencia oficial usa main_adapter=None
  gradient_checkpointing: true   # OBRIGATORIO: o branch extra nao cabe sem

runtime:
  output_dir: outputs/condgeom_smoke
  seed: 42
  seed_per_rank: true         # C7
  num_workers: 4
  pin_memory: true
  mixed_precision: bf16
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  log_every_steps: 10
  save_every_steps: 3
  keep_last_n_checkpoints: 5
  resume: true
  # C10 — validacao deterministica
  eval_every_steps: 0
  eval_max_samples: 32
  eval_num_sigmas: 9
  eval_seed: 1234
  save_best: true
  # T11 — probe de controlabilidade. SEM ISTO o treino nao tem instrumento
  # sensivel ao modo de falha que custou a fase 2 anterior.
  probe_every_steps: 0
  probe_set_dir: null         # PREENCHER: scripts/build_probe_set.py
  probe_num_inference_steps: 28
  probe_seed: 1234
  probe_alerta_queda: 0.10
  # ── perda ponderada por oclusao ────────────────────────────────────────
  # occlusion_lambda: 0.0 reproduz a perda anterior BIT A BIT (ha teste). E isso
  # que torna a condicao de controle A' gratuita.
  # theta/lambda NAO tem default no geocond, de proposito: saem do diagnostico
  # sobre o release NOVO (geocond.loss_weight.diagnostico_peso), nao da tabela
  # da campanha antiga. O numero que governa a escolha e o PISO, nao a fracao
  # de tokens pesados.
  occlusion_lambda: 0.0
  occlusion_theta: 0.9
  occlusion_pool: max         # NAO "mean": uma borda tem 1-2 px e a media a 16x
                              # dilui a amplitude por ~1/16.
  geo_branches: true          # os 2 branches. false = condicao A' (so a perda).


optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_steps: 500
  min_lr_ratio: 0.1

data:
  # O bloco `deblur` nao e usado por este run, mas o schema exige um. Aponta
  # para as fontes do paper e nunca e carregado (o stage e "bokeh").
  deblur:
    datasets:
      - {name: akcit-pixel/DDPD, split: train}
    steps: 60000
  bokeh:
    datasets:
      # PREENCHER com o repo do release da ROTA A publicado pelo bokehnet-regen.
      # Deixado com nome invalido de proposito: um repo antigo aqui treinaria na
      # convencao velha em silencio, que e exatamente o defeito que esta arvore
      # existe para impedir.
      - {name: /raid/user_danielpedrozo/projects/julia/retreinar-bokeh-condgeom/dados/rota_a_pareado, split: train}
    val_datasets:
      - {name: /raid/user_danielpedrozo/projects/julia/retreinar-bokeh-condgeom/dados/rota_a_pareado, split: train}
    steps: 3
    max_samples: 8
    batch_size: 1
    image_size: 512                 # = TILE_SIZE da inferencia (32 tokens x 16 px)
    shuffle: true
    augment: true

    # ── contrato do sinal de controle ────────────────────────────────────────
    defocus_source: metric_disparity

    # ── CONDICIONAMENTO GEOMETRICO (geocond) ────────────────────────────────
    # Com geo_condition: false tudo abaixo e inerte e o comportamento e
    # identico ao do smoke normal — ha teste que tranca isso.
    geo_condition: true
    geo_field: inverse        # u = 1/Z. Ver geocond/contrato.py: a fisica pede
                              # ||grad u||, nao ||grad D||. "depth" existe so
                              # para a diferenca ser ablacionavel.
    geo_ruido_controle: false # true = condicao B', ruido de mesma estatistica
                              # no lugar dos canais. E o controle que separa
                              # "a informacao ajudou" de "mais tokens ajudaram".
    # PREENCHER com a saida de geocond.jobs.calibrar. NAO invente numero aqui:
    # constantes plausiveis silenciosas sao a classe de defeito que a auditoria
    # encontrou, e as da campanha antiga foram calibradas numa distribuicao
    # invalida (ver referencia_antiga/LEIA.md).
    geo_constantes:
      tau_occlusion: 31.6492716484736
      u_max: 3.599870971102308
      s_max: 3.455214049844166
      k0_curvature: 1.0
      kt_max: 8.0
      smooth_sigma: 2.0
      min_niveis_para_segunda_ordem: 256
      # smooth_sigma: 2.0
      # min_niveis_para_segunda_ordem: 256

    require_valid_for_control: true
    exclude_censored_k: true
    # DECISAO NOSSA (A8), nao literal do paper — ver o cabecalho.
    max_levels_per_scene: 4
    # Split POR CENA, lido de manifesto. Sorteado no dataloader ele muda a cada
    # run e "o benchmark esta fora do treino" deixa de ser verificavel.
    scene_split_manifest: null      # PREENCHER: manifests/split_<release>.jsonl
    scene_split_partition: train
    # ── L1: a FORMA do release (ver genfocus_train/release.py) ──────────────
    # O `bokehnet-regen` publica uma ARVORE DE ARQUIVOS (manifest.jsonl,
    # depth/<id>.png, meta/<id>.json, split.json), nao uma tabela com os pixels
    # nas colunas. `auto` decide pelo que da para ver SEM REDE (pasta local com
    # manifest.jsonl, ou snapshot ja em disco); um repo do Hub do release exige
    # `arvore` declarado aqui.
    release_format: auto
    # Espelho de origem, `source_dataset` -> diretorio do snapshot local. So e
    # preciso quando o release NAO e autocontido: por decisao de cota (365 GB
    # contra 115 GB livres) a rota C referencia AIF e bokeh, a B referencia a
    # bokeh e a A referencia a AIF. Se o release sair com --store-source-images,
    # deixe null. PREENCHER conforme a decisao do time de dados.
    #   mirror_roots:
    #     akcit-pixel/RealBokeh: /caminho/do/snapshot
    mirror_roots:
      "EBB!": /raid/user_danielpedrozo/projects/julia/fontes_rota_a/EBB
      GenerativePhotography: /raid/user_danielpedrozo/projects/julia/fontes_rota_a/GenerativePhotography
    # Baixar release/espelho do Hub. Default false, e e decisao declarada: uma
    # auditoria deste projeto mediu 552 GB de egress inexplicado vindo de
    # download automatico. Ler do disco e o default; baixar se pede.
    permitir_download_do_release: false
    # sha256 dos bytes de origem conferido contra source_images.jsonl. E o que
    # faz do join com o espelho uma evidencia em vez de uma afirmacao.
    verificar_sha256_da_origem: true
    # A rota A e uma fonte so; peso nao se aplica. Na fase 2 sim.
    route_weights: null
    min_calibration_ssim: null      # a rota A nao tem sweep da Eq. 5

    # ── eixos C4 ────────────────────────────────────────────────────────────
    # `full_image`: a inferencia tira o mu do image_seq_len da imagem INTEIRA,
    # antes do tiling (flux.py:624). Ver T13.
    sigma_mu_source: full_image
    # `short_side` mantido como default. `native` casa a escala de pixel com a
    # inferencia mas faz o crop de 512 cobrir 1/12 do quadro de uma foto 3MP,
    # com pouca variacao de profundidade dentro do crop. E um A/B a medir com o
    # probe, nao uma correcao obvia. Ver T14.
    scale_mode: short_side

logging:
  use_wandb: false
  wandb_project: genrefocus-bokehnet-v2
  run_name: bokeh-smoke
  wandb_resume: true
  upload_every_steps: 0
  upload_hf_repo_base: null
  upload_final: false
  upload_best: false
  upload_private: true
