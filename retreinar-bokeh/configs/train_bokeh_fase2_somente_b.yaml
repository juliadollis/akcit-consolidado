# =============================================================================
# BOKEHNET (Stage 2) — FASE 2: DADOS REAIS. 60K steps. BRACO PRIMARIO.
# =============================================================================
#
# RODA COM:  sbatch slurm/train_bokeh_fase2_4gpu.slurm
#            (o slurm passa --init-lora outputs/bokeh_fase1_synth)
#
# Este e o braco PRIMARIO: leitura LITERAL do §4.1, "(ii) 60K steps on real
# data". Os bracos B (lr mais baixo) e C (replay sintetico) sao VARIANTES
# declaradas, em arquivos proprios, e existem para TESTAR a hipotese de
# esquecimento — nao para substituir o primario.
#
# -----------------------------------------------------------------------------
# FIEL AO PAPER (conferido literal no PDF)
# -----------------------------------------------------------------------------
# §4.1: "BokehNet uses r=64 ... Both models are trained with a per-GPU batch
#        size of 1 and gradient accumulation over 8 steps on 4x RTX A6000 GPUs.
#        BokehNet is trained in two stages: (i) 40K steps on synthetic data,
#        and (ii) 60K steps on real data."
#   -> bokeh_lora_rank 64, batch_size 1, grad_accum 8, 4 GPUs, steps 40000.
# §3.2(b): ITW — foto de bokeh REAL como entrada, AIF extraida pela DeblurNet,
#        K pela Eq. 3 a partir da EXIF. E a rota B.
# §3.2(c): LFDOF + RealBokeh — pares reais, K pelo sweep de SSIM da Eq. 5, com
#        limiar de SSIM. E a rota C.
#   -> as duas na fase 2. A rota A NAO entra (leitura literal do §4.1).
# §3.2: prompt e condicionamento conferidos contra Inference_bokehNet.py.
#
# -----------------------------------------------------------------------------
# NAO ESPECIFICADO PELO PAPER — escolha nossa, declarada
# -----------------------------------------------------------------------------
# Optimizer, lr, scheduler, warmup, weight decay, precisao, resolucao de treino,
# crop, e a distribuicao de onde a rota A sorteia K. Os valores abaixo sao os
# mesmos do DeblurNet, pelo mesmo motivo: nao mudar duas coisas de uma vez.
#
# -----------------------------------------------------------------------------
# O QUE MUDOU EM RELACAO AO TREINO ANTERIOR (AUDITORIA_TREINO_BOKEHNET.md)
# -----------------------------------------------------------------------------
#   T1  defocus_source: metric_disparity (contrato do release novo)
#   T2  o K passa a ser reescalado pelo fator de resize do crop
#   T3  profundidade reamostrada com NEAREST, como na geracao
#   T4  max_coc deixou de ser ajustavel (asserta 100.0)
#   T6  val_datasets com split POR CENA
#   T7  filtros is_valid_for_control / is_k_censored
#   T9  teto de 4 niveis por cena — DECISAO NOSSA (A8), nao do paper: o
#       supplement B.2 descreve a composicao do dado dos AUTORES, nao um
#       filtro para as outras rotas. Motivo: 25% das amostras vinham de
#       6,2% das cenas.
#   T11 probe de LVCorr a cada 5000 steps
#   T13 sigma_mu_source: full_image (o que a inferencia faz)
# =============================================================================

model:
  # SNAPSHOT LOCAL, não o repo-id. Com o repo-id o diffusers vai pelo
  # `hf_hub_download`, que precisa ESCREVER em `blobs/` — e o diretório do FLUX
  # nesta máquina é root-owned, de uma rodada antiga sem `--user`. Dois
  # lançamentos morreram assim em 2026-09-25:
  #   FileNotFoundError: .../models--black-forest-labs--FLUX.1-dev/blobs
  # Além disso, repo-id que funciona BAIXA — e a regra do projeto é não baixar.
  # O treino agora recusa um caminho que não seja diretório local.
  # Sobrescreva com FLUX_PATH=... se o snapshot estiver em outro lugar.
  pretrained_model_name_or_path: /workspace/hf-cache/hub/models--black-forest-labs--FLUX.1-dev/snapshots/3de623fc3c33e44ffbe2bad470d0f45bccf2eb21
  max_coc: 100.0              # ASSERCAO do contrato, nao ajuste. Ver control.py.
  deblur_lora_rank: 128
  bokeh_lora_rank: 64         # §4.1
  expected_lora_modules: 343  # C1 — trava; bokehNet.safetensors tem 686/2 = 343
  bokeh_train_guidance: 1.0   # Inference_bokehNet.py passa guidance_scale=1.0
  cond_train_guidance: 1.0    # flux.py: c_guidances = torch.ones
  lora_on_main: false         # a inferencia oficial usa main_adapter=None
  gradient_checkpointing: false

runtime:
  output_dir: outputs/bokeh_fase2_b
  seed: 42
  seed_per_rank: true         # C7
  num_workers: 4
  pin_memory: true
  mixed_precision: bf16
  # 1 x 16 x 2 GPUs = batch efetivo 32, o mesmo do §4.1. Com 2 GPUs em vez de
  # 4, o que muda é a VAZÃO (13,2 s/step em vez de 6,6), não o tamanho do batch
  # — e é o batch que define o experimento. Com 4 GPUs, use --grad-accum 8.
  gradient_accumulation_steps: 16
  max_grad_norm: 1.0
  log_every_steps: 10
  save_every_steps: 250
  # 2, e não 5. Cada checkpoint da BokehNet é 2,78 GB (LoRA + optimizer), então
  # 5 são 14 GB parados. Em 2026-09-28 o run oficial morreu no step 1.000 com
  # `RuntimeError: unexpected pos` no `torch.save` — o `/raid` tinha batido nos
  # 600 GB de cota por usuário e o `.tmp` parou de escrever no meio. Foram 19 h
  # de 4 GPUs perdidas por 700 MB que faltaram.
  # 2 bastam para retomar, e o `best.pt` fica FORA da poda.
  keep_last_n_checkpoints: 2
  resume: true
  # C10 — validacao deterministica
  eval_every_steps: 500
  eval_max_samples: 32
  eval_num_sigmas: 9
  eval_seed: 1234
  save_best: true
  # T11 — probe de controlabilidade. SEM ISTO o treino nao tem instrumento
  # sensivel ao modo de falha que custou a fase 2 anterior.
  # 0 = probe INTERNO desligado, e o treino agora RECUSA subir multi-GPU com
  # ele ligado. Ele roda ~5 min só no rank 0 e trava os outros no `all_reduce`
  # seguinte: e a dessincronia do watchdog do NCCL abortou este treino 2x.
  # A controlabilidade se mede POR FORA, sem tocar no treino:
  #   scripts/monitor_externo.py --output-dir <output_dir> --release <...>
  probe_every_steps: 0
  probe_set_dir: null         # usado pelo monitor externo, não por este laço
  probe_num_inference_steps: 28
  probe_seed: 1234
  probe_alerta_queda: 0.10

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_steps: 500
  min_lr_ratio: 0.1

data:
  # O bloco `deblur` nao e usado por este run, mas o schema exige um. Aponta
  # para as fontes do paper e nunca e carregado (o stage e "bokeh").
  deblur:
    datasets:
      - {name: akcit-pixel/DDPD, split: train}
    steps: 60000
  bokeh:
    # §4.1: "a **hybrid dataset** ... **combined with** ~26K real examples".
    # As duas rotas ENTRAM JUNTAS — a Tab. 6 varia INCLUSÃO, não ordem.
    #   rota b: 13.765 amostras / 13.765 cenas · BokehDiffusion · K da Eq. 3 (EXIF)
    #   rota c: 15.423 amostras /  4.399 cenas · RealBokeh      · K da Eq. 5 (sweep)
    #   total 29.188 reais — o paper fala em ~26K (ITW + RealBokeh + LFDOF).
    # DIVERGÊNCIA DECLARADA: não há LFDOF aqui. O §3.2(c) cita as duas fontes e
    # a rota c regerada só tem RealBokeh.
    # ROTA B SOMENTE — desvio DECLARADO, não é o que o §4.1 manda.
    #
    # A rota C está pronta em disco (15.423 amostras, release completo), mas o
    # ESPELHO dela não: `akcit-pixel/RealBokeh` é privado e a org estourou a
    # cota de armazenamento do HF, então os 90 shards `train`/`validation`
    # respondem 403:
    #   "Private repository storage limit reached for akcit-pixel"
    # Só os 6 shards `test` estão em cache local — e são exatamente os 814 que
    # o §11.1 manda EXCLUIR por vazamento com os benches.
    #
    # Quando o espelho voltar, a fase 2 completa é `train_bokeh_fase2_bc.yaml`,
    # em RUN NOVO. Não se acrescenta dado no meio de um run: o princípio desta
    # árvore é que o treino começa e termina do mesmo jeito.
    datasets:
      - {name: /workspace/releases/rota_b, split: train}
    # A partição vira "val" dentro de `_build_val_loader`; o split sai do
    # `split.json` de cada release e a fronteira é POR CENA.
    val_datasets:
      - {name: /workspace/releases/rota_b, split: train}
    steps: 60000                    # §4.1 fase (ii)
    batch_size: 1
    image_size: 512                 # = TILE_SIZE da inferencia (32 tokens x 16 px)
    shuffle: true
    augment: true

    # ── contrato do sinal de controle ────────────────────────────────────────
    defocus_source: metric_disparity
    require_valid_for_control: true
    # DECISAO NOSSA (A8), nao literal do paper — ver o cabecalho.
    max_levels_per_scene: 4
    # Split POR CENA, lido de manifesto. Sorteado no dataloader ele muda a cada
    # run e "o benchmark esta fora do treino" deixa de ser verificavel.
    # `null` é o valor CERTO para release em árvore: o split vem do
    # `split.json` materializado dentro de cada release.
    scene_split_manifest: null
    scene_split_partition: train
    # ── L1: a FORMA do release (ver genfocus_train/release.py) ──────────────
    # O `bokehnet-regen` publica uma ARVORE DE ARQUIVOS (manifest.jsonl,
    # depth/<id>.png, meta/<id>.json, split.json), nao uma tabela com os pixels
    # nas colunas. `auto` decide pelo que da para ver SEM REDE (pasta local com
    # manifest.jsonl, ou snapshot ja em disco); um repo do Hub do release exige
    # `arvore` declarado aqui.
    release_format: auto
    # Espelho de origem, `source_dataset` -> diretorio do snapshot local. So e
    # preciso quando o release NAO e autocontido: por decisao de cota (365 GB
    # contra 115 GB livres) a rota C referencia AIF e bokeh, a B referencia a
    # bokeh e a A referencia a AIF. Se o release sair com --store-source-images,
    # deixe null. PREENCHER conforme a decisao do time de dados.
    #   mirror_roots:
    #     akcit-pixel/RealBokeh: /caminho/do/snapshot
    mirror_roots:
      # rota b — a foto real é o ALVO; a AIF está em `generated/`
      atfortes/BokehDiffusion: /workspace/hf-cache-julia/hub/datasets--atfortes--BokehDiffusion/snapshots/82d2ed2af256405ccdb4c20c2920d8c0fd282af2
      # rota c — os DOIS lados vêm daqui (`image_focus` / `image_blur`)
      akcit-pixel/RealBokeh: /workspace/hf-cache-julia/hub/datasets--akcit-pixel--RealBokeh/snapshots/fb183bfd78525ba4ee2c69d19943ea27d3a08ddc
    # Baixar release/espelho do Hub. Default false, e e decisao declarada: uma
    # auditoria deste projeto mediu 552 GB de egress inexplicado vindo de
    # download automatico. Ler do disco e o default; baixar se pede.
    permitir_download_do_release: false
    # sha256 dos bytes de origem conferido contra source_images.jsonl. E o que
    # faz do join com o espelho uma evidencia em vez de uma afirmacao.
    verificar_sha256_da_origem: true
    # T10 — a proporcao entre rotas era ACIDENTE (tamanho relativo dos shards).
    # B e C ocupam faixas de defocus diferentes por fisica ([0,0.05] x [0,0.4]) e
    # ensinam coisas diferentes: B ensina aparencia optica real com AIF vinda da
    # DeblurNet (a distribuicao da inferencia); C ensina variacao de K DENTRO da
    # cena, que e o controle. Deixado null (= proporcional) para nao mudar duas
    # coisas de uma vez, mas as contagens por rota vao para o log e para o
    # run_metadata. Preencher depois de medir.
    # DECISÃO NOSSA, declarada. 50/50 explícito em vez de `null`.
    # Com `null` a proporção seria o tamanho relativo dos shards — 13.765 contra
    # 14.609, ou seja 48,5/51,5, que é quase isto mas por ACIDENTE. A Tab. 6
    # mostra que a composição importa ((a)+(c) dá 0,0972 e (a)+(b), 0,1156),
    # então o número tem de ser escolhido, não herdado do pipeline de dados.
    # uma rota só: peso não se aplica.
    route_weights: null
    # DECISÃO NOSSA, medida na distribuição REAL da rota c (15.423 amostras):
    #   p5=0,771  p25=0,917  p50=0,963  p75=0,986  p95=0,997
    #   limiar 0,6 mantém 99,5% · 0,7 mantém 97,7% · 0,8 mantém 93,2%
    # 0,7 corta a cauda que o sweep da Eq. 5 não conseguiu ajustar sem jogar
    # fora dado bom. O paper não publica o valor (§3.2(c) só diz que existe).
    # A rota b tem a coluna PRESENTE e NULA e NÃO é cortada por isto — ela
    # deriva o K da Eq. 3, não de sweep (tests/test_rotas_b_c.py trava isso).
    # a rota B tem a coluna PRESENTE e NULA (K da Eq. 3, não de sweep):
    # um limiar aqui zeraria a rota inteira. Ver tests/test_rotas_b_c.py.
    min_calibration_ssim: null
    # VAZAMENTO. A rota c sai do split `test` da RealBokeh e os benches
    # `bokeh-bench-realbokeh-test` e `-v2` saem do MESMO lugar: 220 de 220
    # cenas do bench estão na rota c (medido). Custa 814/15.423 = 5,3% tirar;
    # não tirar custa o significado do número da RealBokeh.
    # a lista é da rota C; sem ela no treino, não há o que excluir.
    excluir_cenas_de_avaliacao: null
    # 642 amostras da rota c têm `is_k_censored: true` (o sweep bateu no teto).
    exclude_censored_k: true

    # ── eixos C4 ────────────────────────────────────────────────────────────
    # `full_image`: a inferencia tira o mu do image_seq_len da imagem INTEIRA,
    # antes do tiling (flux.py:624). Ver T13.
    sigma_mu_source: full_image
    # `short_side` mantido como default. `native` casa a escala de pixel com a
    # inferencia mas faz o crop de 512 cobrir 1/12 do quadro de uma foto 3MP,
    # com pouca variacao de profundidade dentro do crop. E um A/B a medir com o
    # probe, nao uma correcao obvia. Ver T14.
    scale_mode: short_side

logging:
  use_wandb: true
  wandb_project: genrefocus-bokehnet-v2
  run_name: bokeh-fase2-somente-b-60k
  wandb_resume: true
  upload_every_steps: 1000
  upload_hf_repo_base: juliadollis/genrefocus-bokehnet-v2-fase2-somente-b
  upload_final: true
  upload_best: true
  upload_private: true
